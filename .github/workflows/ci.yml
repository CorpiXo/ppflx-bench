name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests
    # Unit tests only: no datasets are downloaded and no benchmark is run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        # CPU-only torch and torchvision, as in README "Benchmark on a new
        # machine"; the same versions requirements.txt and ppflx pin.
        run: |
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: pytest
        run: pytest tests -ra --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Every test ran
        run: |
          python - "$RUNNER_TEMP/junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          skipped = [
              f"{case.get('classname')}::{case.get('name')}: {case.find('skipped').get('message')}"
              for case in ET.parse(sys.argv[1]).iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              print("Skipped:", *skipped, sep="\n  ")
              sys.exit(1)
          print("No test skipped.")
          PY
